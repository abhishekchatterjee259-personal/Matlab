name: MATLAB CI

on:
  push:
    branches:
      - main
      - Dev
      - AbhiMergeResolve

  pull_request:
    branches:
      - main
      - Dev
      - AbhiMergeResolve

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Verify MATLAB installation
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp('MATLAB CI pipeline is working');
            version
            ver

      - name: Load MATLAB Project
        uses: matlab-actions/run-command@v2
        with:
          command: |
            proj = matlab.project.loadProject(fullfile(pwd,'Matlab.prj'));
            disp(['Loaded Project: ', proj.Name]);

      - name: Run Process Advisor checks
        uses: matlab-actions/run-command@v2
        with:
          command: |
            resultsDir = fullfile(pwd,'PA_Results');

            if ~exist(resultsDir,'dir')
                mkdir(resultsDir);
            end

            proj = matlab.project.loadProject(fullfile(pwd,'Matlab.prj'));

            if exist('padv.ProcessModel','class')

                disp('Process Advisor found.');

                try
                    pm = padv.ProcessModel;

                    results = pm.runAll();

                    save(fullfile(resultsDir,'ci_results.mat'),'results');

                    disp('Process Advisor completed successfully.');

                catch ME

                    disp(getReport(ME));

                    fid = fopen(fullfile(resultsDir,'ProcessAdvisorError.txt'),'w');
                    fprintf(fid,'%s',getReport(ME));
                    fclose(fid);

                    rethrow(ME);
                end

            else

                warning('Process Advisor not available.');

                fid = fopen(fullfile(resultsDir,'dummy.txt'),'w');
                fprintf(fid,'Process Advisor not available in this environment.');
                fclose(fid);

            end

      - name: Upload Process Advisor Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PA_Results
          path: PA_Results
